<style>
:root{--gold:#C9A84C;--gold2:#E0A10A;--black:#1A1A1A;--navy:#002060;--char:#3B3838;--cream:#FBF8EE;--band:#F8F1DB;--line:#E3DAC0;--red:#B3261E;--green:#1E7B3A}
*{box-sizing:border-box}
html{font-size:11pt}
body{margin:0;font-family:'Bookman Old Style','Bookman','URW Bookman','Georgia',serif;color:var(--black);background:var(--cream)}
header.top{background:var(--black);color:#fff;border-bottom:4px solid var(--gold);padding:.5rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.8rem}
.brand img{height:46px;width:auto}
header.top h1{font-size:1.25rem;margin:0;color:var(--gold);letter-spacing:.02em}
header.top small{color:#d9d3c0;display:block;font-size:.8rem}
header.top .sp{flex:1}
header.top .who{color:#fff;font-size:.95rem}
.chip{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.8rem;background:var(--gold);color:var(--black);font-weight:bold;white-space:nowrap}
.chip.navy{background:var(--navy);color:#fff}.chip.red{background:var(--red);color:#fff}.chip.green{background:var(--green);color:#fff}.chip.grey{background:#ddd;color:#333}.chip.out{background:#fff;color:var(--navy);border:1px solid var(--navy)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 1.2rem;display:flex;gap:.1rem;flex-wrap:wrap}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.65rem .75rem;font:inherit;cursor:pointer;color:var(--char)}
nav.tabs button.on{border-bottom-color:var(--gold);color:var(--navy);font-weight:bold}
nav.tabs .grp{align-self:center;color:#b3a680;font-size:.75rem;padding:0 .3rem;text-transform:uppercase;letter-spacing:.05em}
main{max-width:1300px;margin:0 auto;padding:1.2rem}
h2{color:var(--navy);margin:.2rem 0 .1rem;font-size:1.35rem}
h3{color:var(--navy);margin:1.2rem 0 .4rem;font-size:1.05rem;border-bottom:2px solid var(--gold);padding-bottom:.2rem}
h4{color:var(--navy);margin:.9rem 0 .3rem}
.lead{font-size:14pt;color:var(--char);margin:.1rem 0 1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin:.6rem 0 1rem}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:.6rem .8rem}
.kpi b{display:block;font-size:1.3rem;color:var(--navy)}.kpi span{font-size:.8rem;color:var(--char)}
label{display:block;font-size:.85rem;color:var(--char);margin:.5rem 0 .15rem}
input,select,textarea{font:inherit;padding:.4rem .5rem;border:1px solid #bdb59b;border-radius:5px;width:100%;background:#fff}
input[type=checkbox]{width:auto}
textarea{min-height:60px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.btn{font:inherit;background:var(--gold);color:var(--black);border:1px solid #a98d38;border-radius:6px;padding:.45rem .9rem;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(.95)}
.btn.dark{background:var(--black);color:var(--gold);border-color:var(--black)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy);font-weight:normal}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red);font-weight:normal}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:.2rem .55rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--navy);color:#fff;text-align:left;padding:.45rem .6rem;white-space:nowrap}
td{padding:.4rem .6rem;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--band)}
tr.tot td{background:var(--black);color:var(--gold);font-weight:bold}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.muted{color:#7a7468;font-size:.85rem}
.banner{border-radius:6px;padding:.6rem .9rem;margin-bottom:.8rem;border:1px solid}
.banner.warn{background:#FFF4D6;border-color:var(--gold)}.banner.err{background:#FDE7E5;border-color:var(--red)}.banner.ok{background:#E6F4EA;border-color:var(--green)}.banner.info{background:#EEF2FA;border-color:var(--navy)}
.clock{font-size:2.8rem;color:var(--navy);font-variant-numeric:tabular-nums;font-weight:bold}
.tabs2{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.tabs2 button{font:inherit;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:.3rem .8rem;border-radius:99px;cursor:pointer}
.tabs2 button.on{background:var(--navy);color:#fff}
.filters{display:flex;gap:.7rem;flex-wrap:wrap;align-items:end;margin-bottom:.8rem}
.filters>div{min-width:150px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;overflow:auto;z-index:50}
.box{background:#fff;border-top:5px solid var(--gold);border-radius:8px;padding:1.1rem 1.3rem;width:100%;max-width:540px}
.box.wide{max-width:1050px}
.box img.receipt{max-width:100%;border:1px solid var(--line)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:.4rem;align-items:center}
#toast div{background:var(--black);color:#fff;padding:.5rem 1rem;border-radius:6px;border-left:5px solid var(--gold);max-width:90vw}
#toast div.err{border-left-color:var(--red);background:#5b1410}
.login{max-width:460px;margin:6vh auto;padding:0 1rem}
.login .logo{display:block;margin:0 auto .6rem;height:120px}
.login h1{text-align:center;color:var(--navy);margin:.2rem 0}
.login .sub{text-align:center;color:var(--char);margin-bottom:1rem}
footer{max-width:1300px;margin:1rem auto 2rem;padding:0 1.2rem;color:#7a7468;font-size:.8rem}
.ok{color:var(--green)}.bad{color:var(--red)}
.help ol li,.help ul li{margin:.25rem 0}
.help .card{font-size:1rem}
.code{font-family:Consolas,monospace;font-size:1.6rem;letter-spacing:.15em;background:var(--band);padding:.4rem .8rem;border-radius:6px;display:inline-block;color:var(--navy)}
.loading{padding:2rem;text-align:center;color:var(--char)}
.st-Submitted{background:#EEF2FA;color:var(--navy)}.st-Validated{background:#FFF4D6;color:#6b5200}.st-Returned{background:#FDE7E5;color:var(--red)}.st-Approved{background:#E6F4EA;color:var(--green)}.st-Rejected{background:#5b1410;color:#fff}.st-Withdrawn{background:#ddd;color:#555}
.st{padding:.1rem .5rem;border-radius:99px;font-size:.8rem;font-weight:bold;white-space:nowrap}
</style>
</head>

/* ====================== HELPERS ====================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=v=>Number(v||0);
const peso=n=>'₱'+num(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs=n=>num(n).toFixed(2);
const MNL=8*36e5;
const mdate=iso=>new Date(new Date(iso).getTime()+MNL);
const ymd=iso=>{const d=mdate(iso);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const ym=iso=>ymd(iso).slice(0,7);
const hm=iso=>{const d=mdate(iso);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const fmtDT=iso=>iso?ymd(iso)+' '+hm(iso):'—';
const toInput=iso=>iso?ymd(iso)+'T'+hm(iso):'';
const fromInput=v=>v?new Date(v+':00+08:00').toISOString():null;
const dayStartISO=d=>new Date(d+'T00:00:00+08:00').toISOString();
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const nowMs=()=>Date.now()+S.skew;
const nowISO=()=>new Date(nowMs()).toISOString();
const today=()=>ymd(nowISO());
const fmtClock=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const durH=t=>t.ended_at?(new Date(t.ended_at)-new Date(t.started_at))/36e5:0;
const liveH=t=>t.ended_at?durH(t):(nowMs()-new Date(t.started_at))/36e5;
const isProfit=u=>PROFIT.includes(u);
function toast(msg,kind){const d=document.createElement('div');if(kind)d.className=kind;d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),kind==='err'?7000:3500)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function cleanErr(e){let m=(e&&(e.message||e.error_description||e.msg))||String(e);if(/Failed to fetch|NetworkError|Load failed/i.test(m))m='Cannot reach the server. Check your internet connection and try again.';if(/Invalid login credentials/i.test(m))m='Incorrect email or password.';if(/JWT|token/i.test(m)&&/expired/i.test(m))m='Your session expired. Please sign in again.';return m}

/* ====================== DATA ACCESS ====================== */
async function rpc(name,args){const {data,error}=await db.rpc(name,args||{});if(error)throw new Error(cleanErr(error));return data}
async function sel(table,build,cols){const out=[];for(let from=0;;from+=1000){let q=db.from(table).select(cols||'*');if(build)q=build(q);q=q.range(from,from+999);const {data,error}=await q;if(error)throw new Error(cleanErr(error));out.push(...(data||[]));if(!data||data.length<1000)break}return out}
async function selIn(table,col,vals,build){const u=[...new Set(vals)];const out=[];for(let i=0;i<u.length;i+=150){const part=u.slice(i,i+150);out.push(...await sel(table,q=>{q=q.in(col,part);return build?build(q):q}))}return out}
async function write(p){const {data,error}=await p;if(error)throw new Error(/duplicate key/i.test(error.message)?'A record with the same key already exists.':cleanErr(error));return data}

/* ====================== STATE ====================== */
const S={session:null,me:null,roster:[],tickets:[],revenue:{},pay:[],settings:null,skew:0,running:null,queue:[]};
const UI={view:null,f:{},sub:{},modal:null,data:null,loading:false,showPay:false};
const role=()=>S.me&&S.me.role;
const isOps=()=>role()==='operations',isFin=()=>role()==='finance',isMgmt=()=>role()==='management';
const canAll=()=>['operations','finance','management'].includes(role());
const canCost=()=>isFin()||isMgmt();
const canAdmin=()=>isOps()||isMgmt();
const person=code=>S.roster.find(r=>r.code===code);
const pname=code=>{const p=person(code);return p?p.name:code};
const ticket=no=>S.tickets.find(t=>t.no===no);

async function loadBase(){
  const {data:{session}}=await db.auth.getSession();S.session=session;
  if(!session){S.me=null;return}
  S.roster=await sel('roster',q=>q.order('name'));
  S.me=S.roster.find(r=>r.user_id===session.user.id&&r.active)||null;
  if(!S.me)return;
  try{const t=await rpc('server_now');S.skew=new Date(t).getTime()-Date.now()}catch(e){S.skew=0}
  await refreshTickets();
  if(canCost()){S.pay=await sel('pay',q=>q.order('effective_date',{ascending:false}));const st=await sel('settings');S.settings=st[0]||null}
  await refreshLive();
}
async function refreshTickets(){

  if(canCost()){const rv=await sel('ticket_revenue');S.revenue={};rv.forEach(r=>S.revenue[r.ticket_no]=r)}
}
async function refreshLive(){

function canOpsStep(e){if(e.status!=='Submitted'||e.staff_code===S.me.code)return false;const c=person(e.staff_code);return isOps()||(isMgmt()&&c&&c.role==='operations')}
function canFinStep(e){if(e.status!=='Validated'||e.staff_code===S.me.code)return false;const c=person(e.staff_code);return isFin()||(isMgmt()&&c&&c.role==='finance')}

/* ====================== COSTING (Finance / Management) ====================== */
function payFor(code,d){let best=null;for(const p of S.pay)if(p.code===code&&p.effective_date<=d&&(!best||p.effective_date>best.effective_date))best=p;return best}
function rateFor(code,d){const p=payFor(code,d);if(!p||!S.settings)return null;return(num(p.monthly_salary)+num(p.monthly_benefits))*12/num(S.settings.work_days)/num(S.settings.hours_per_day)}
const mult=wt=>S.settings&&S.settings['m_'+wt]!=null?num(S.settings['m_'+wt]):1;
function laborOf(t){const r=rateFor(t.staff_code,ymd(t.started_at));return r==null?null:durH(t)*r*mult(t.work_type)}

/* ====================== RANGE ====================== */
function range(prefix){prefix=prefix||'';const p=UI.f[prefix+'preset']||'month';const t=today();const y=+t.slice(0,4),m=+t.slice(5,7);let from,to,label;
  if(p==='month'){from=`${y}-${pad(m)}-01`;to=m===12?`${y+1}-01-01`:`${y}-${pad(m+1)}-01`;label='This month'}
  else if(p==='last'){const ly=m===1?y-1:y,lm=m===1?12:m-1;from=`${ly}-${pad(lm)}-01`;to=`${y}-${pad(m)}-01`;label='Last month'}
  else if(p==='week'){from=addDays(t,-6);to=addDays(t,1);label='Last 7 days'}
  else if(p==='year'){from=`${y}-01-01`;to=`${y+1}-01-01`;label='This year'}
  else{from=UI.f[prefix+'from']||`${y}-${pad(m)}-01`;to=addDays(UI.f[prefix+'to']||t,1);label='Custom'}
  return{from,to,fromISO:dayStartISO(from),toISO:dayStartISO(to),label,preset:p}}
function rangeFilter(prefix,lbl){const r=range(prefix);prefix=prefix||'';return `<div><label>${lbl||'Period (by task start)'}<select data-f="${prefix}preset">${[['week','Last 7 days'],['month','This month'],['last','Last month'],['year','This year'],['custom','Custom range']].map(([v,l])=>`<option value="${v}"${r.preset===v?' selected':''}>${l}</option>`).join('')}</select></label></div>${r.preset==='custom'?`<div><label>From<input type="date" data-f="${prefix}from" value="${esc(UI.f[prefix+'from']||r.from)}"></label></div><div><label>To<input type="date" data-f="${prefix}to" value="${esc(UI.f[prefix+'to']||addDays(r.to,-1))}"></label></div>`:''}`}

function closeModal(){UI.modal=null;renderModal()}
function renderModal(){const el=$('#modal');if(!UI.modal){el.innerHTML='';return}const m=UI.modal;
  const data=m.data?Object.entries(m.data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' '):'';

function navHtml(){return `<nav class="tabs">${NAV.map(([g,items,roles])=>{if(roles&&!roles.includes(role()))return '';const its=items.filter(([k])=>allowed(k));if(!its.length)return '';return (g?`<span class="grp">${g}</span>`:'<span class="grp">·</span>')+its.map(([k,l])=>`<button data-act="nav" data-v="${k}" class="${UI.view===k?'on':''}">${l}${badge(k)}</button>`).join('')}).join('')}</nav>`}
function badge(k){let n=0;if(k==='myexp')n=S.queue.filter(e=>e.staff_code===S.me.code&&e.status==='Returned').length;if(k==='expreview')n=S.queue.filter(e=>canOpsStep(e)||canFinStep(e)).length;return n?` <span class="chip ${k==='myexp'?'red':''}">${n}</span>`:''}
function header(){return `<header class="top"><div class="brand"><img src="${LOGO}" alt="TRANGIA"><div><h1>TRANGIA Job Ticket System</h1><small>Tax | Accounting | Licensing | Audit | Advisory</small></div></div><div class="sp"></div><span class="chip ${role()==='staff'?'':'navy'}">${esc(ROLES[role()]||'').toUpperCase()}</span><span class="who">${esc(S.me.name)} (${esc(S.me.code)})</span><button class="btn sm ghost" data-act="refresh" title="Reload data">↻ Refresh</button><button class="btn sm ghost" data-act="signOut">Sign out</button></header>`}

  else if(r&&UI.view!=='timer')h+=`<div class="banner info">⏱ Timer running on <b>${esc(r.id)}</b> — ${esc(r.description)} · <span data-elapsed="${esc(r.started_at)}">${fmtClock(nowMs()-new Date(r.started_at))}</span> <button class="btn sm dark" data-act="stopTask">■ Stop</button></div>`;

function footer(){return `<footer>TRANGIA · Operations Department · Job Ticket System v2 — proposed procedure, not an approved company policy until signed off by the COO/CEO. Pay multipliers must be confirmed by Finance/HR before costs are relied upon. Data privacy: handle all employee and client data under RA 10173.</footer>`}

function ticketOptions(sel,filter){const list=S.tickets.filter(filter||(t=>t.status==='Open'));if(sel&&!list.some(t=>t.no===sel)){const t=ticket(sel);if(t)list.push(t)}
  const lbl=t=>`${t.no} · ${t.client} · ${t.unit} (${t.period})${t.status!=='Open'?' ['+t.status+']':''}`;

  return g('Client service (profit centers)',list.filter(t=>t.type==='Profit'))+g('Internal (cost centers)',list.filter(t=>t.type==='Cost'))}

V.timer=Object.assign(d=>{const run=S.running;const tasks=(d&&d.today)||[];const th=tasks.filter(t=>!t.voided).reduce((a,t)=>a+liveH(t),0);let top;
  if(run){const tk=ticket(run.ticket_no);top=`<div class="card"><span class="chip green">RUNNING</span> <b>${esc(run.id)}</b><div class="clock" data-elapsed="${esc(run.started_at)}">${fmtClock(nowMs()-new Date(run.started_at))}</div><div><b>${esc(run.description)}</b></div><div class="muted">${esc(run.ticket_no)} · ${esc(tk?tk.client:'')} · ${esc(WT[run.work_type])} · started ${fmtDT(run.started_at)} (server time)</div><div class="actions"><button class="btn dark" data-act="stopTask">■ Stop</button><button class="btn ghost" data-act="newExpense" data-id="${esc(run.id)}">+ Add expense</button><button class="btn ghost" data-act="editTask" data-id="${esc(run.id)}">Correct start time</button></div></div>`}
  else{const open=S.tickets.filter(t=>t.status==='Open');top=`<div class="card"><h3 style="margin-top:0">Start a task</h3>${open.length?`<form data-form="start"><label>Job ticket<select name="ticket" required><option value="">— select ticket —</option>${ticketOptions(UI.f.lastTicket||'')}</select></label><label>What are you working on?<input name="desc" required maxlength="200" placeholder="e.g. Prepare Q4 2550Q workpapers"></label><label>Work type<select name="wt">${Object.entries(WT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><div class="actions"><button class="btn">▶ Start timer</button></div></form>`:'<p>No open job tickets yet. Operations opens tickets; ask them if the ticket you need is missing.</p>'}</div>`}
  return `<h2>Timer</h2><p class="lead">${esc(S.me.name)} — press Start when you begin a task and Stop when you finish. Times come from the server clock.</p>${top}<h3>Today</h3>${tasks.length?`<div class="tw"><table><thead><tr><th>Task ID</th><th>Ticket</th><th>Task</th><th>Start</th><th>Finish</th><th class="n">Hours</th></tr></thead><tbody>${tasks.map(t=>`<tr${t.voided?' style="opacity:.5"':''}><td class="nw">${esc(t.id)}</td><td class="nw">${esc(t.ticket_no)}</td><td>${esc(t.description)}</td><td class="nw">${hm(t.started_at)}</td><td class="nw">${t.ended_at?hm(t.ended_at):'<span class="chip green">running</span>'}</td><td class="n">${hrs(liveH(t))}</td></tr>`).join('')}</tbody></table></div><p class="muted">Total today: <b>${hrs(th)}</b> hours</p>`:'<p class="muted">Nothing logged today.</p>'}`},

async function withExtras(tasks){const ids=tasks.map(t=>t.id);const [edits,exps]=ids.length?await Promise.all([selIn('task_edits','task_id',ids,q=>q.order('edited_at')),selIn('expenses','task_id',ids)]):[[],[]];
  const E={},X={};edits.forEach(e=>(E[e.task_id]=E[e.task_id]||[]).push(e));exps.forEach(e=>(X[e.task_id]=X[e.task_id]||[]).push(e));return{tasks,E,X}}
const expTot=(list,st)=>(list||[]).filter(e=>st.includes(e.status)).reduce((a,e)=>a+num(e.amount),0);
function flags(t,E){const f=[];if(t.voided)f.push('<span class="chip grey">VOID</span>');if(!t.ended_at&&!t.voided)f.push('<span class="chip green">running</span>');if(E[t.id])f.push('<span class="chip">edited</span>');if(t.ops_edited)f.push('<span class="chip navy">ops-edited</span>');if(durH(t)>12)f.push('<span class="chip red">&gt;12h</span>');return f.join(' ')}
function editHistory(t,E){return E[t.id]?`<div class="muted">${E[t.id].map(e=>`${fmtDT(e.edited_at)} by ${esc(pname(e.edited_by))}: “${esc(e.reason)}” (was ${fmtDT(e.from_start)}–${fmtDT(e.from_end)}${e.from_ticket!==e.to_ticket?', ticket '+esc(e.from_ticket):''})`).join('<br>')}</div>`:''}
V.log=Object.assign(d=>{const {tasks,E,X}=d;const live=tasks.filter(t=>!t.voided);const tot=live.reduce((a,t)=>a+durH(t),0);
  return `<h2>My Log</h2><p class="lead">Your tasks, timestamps and expenses. Every correction keeps the original times on record.</p><div class="filters">${rangeFilter('log')}<div><label>Ticket<select data-f="logTicket"><option value="">All</option>${ticketOptions(UI.f.logTicket,()=>true)}</select></label></div></div><div class="tw"><table><thead><tr><th>Task ID</th><th>Ticket</th><th>Task</th><th>Type</th><th>Start</th><th>Finish</th><th class="n">Hours</th><th class="n">Expenses</th><th>Flags</th><th></th></tr></thead><tbody>${tasks.map(t=>`<tr${t.voided?' style="opacity:.55"':''}><td class="nw">${esc(t.id)}</td><td class="nw">${esc(t.ticket_no)}</td><td>${esc(t.description)}${editHistory(t,E)}${t.voided?`<div class="muted">Voided: ${esc(t.void_reason)}</div>`:''}</td><td>${esc(WT[t.work_type])}</td><td class="nw">${fmtDT(t.started_at)}</td><td class="nw">${fmtDT(t.ended_at)}</td><td class="n">${t.ended_at?hrs(durH(t)):'—'}</td><td class="n">${peso(expTot(X[t.id],['Submitted','Validated','Returned','Approved']))}</td><td>${flags(t,E)}</td><td class="nw">${t.voided?'':`<button class="btn sm ghost" data-act="editTask" data-id="${esc(t.id)}">Edit</button> <button class="btn sm ghost" data-act="newExpense" data-id="${esc(t.id)}">+ Expense</button> <button class="btn sm danger" data-act="voidTask" data-id="${esc(t.id)}">Void</button>`}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">No tasks in this period.</td></tr>'}<tr class="tot"><td colspan="6">Total (excluding voided)</td><td class="n">${hrs(tot)}</td><td class="n">${peso(live.reduce((a,t)=>a+expTot(X[t.id],['Submitted','Validated','Returned','Approved']),0))}</td><td colspan="2"></td></tr></tbody></table></div>`},
  {load:async()=>{const r=range('log');const tasks=await sel('tasks',q=>{q=q.eq('staff_code',S.me.code).gte('started_at',r.fromISO).lt('started_at',r.toISO).order('started_at',{ascending:false});return UI.f.logTicket?q.eq('ticket_no',UI.f.logTicket):q});return withExtras(tasks)}});

async function uploadReceipt(file){if(!RECEIPT_TYPES.includes(file.type))throw new Error('Receipt must be a photo (JPG, PNG, WEBP, HEIC) or a PDF.');if(file.size>10*1024*1024)throw new Error('Receipt is larger than 10 MB.');
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';const path=`${S.session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await db.storage.from('receipts').upload(path,file,{contentType:file.type,upsert:false});if(error)throw new Error('Receipt upload failed: '+cleanErr(error));return path}

}});

ACT.drill=async d=>{const t=ticket(d.no);if(!t)return;try{const tasks=(await sel('tasks',q=>q.eq('ticket_no',t.no).eq('voided',false).order('started_at')));const exps=tasks.length?await selIn('expenses','task_id',tasks.map(x=>x.id)):[];const X={};exps.forEach(e=>(X[e.task_id]=X[e.task_id]||[]).push(e));

async function reportData(prefix){const r=range(prefix);const tasks=(await sel('tasks',q=>q.gte('started_at',r.fromISO).lt('started_at',r.toISO).eq('voided',false))).filter(t=>t.ended_at);
  const exps=tasks.length?await selIn('expenses','task_id',tasks.map(t=>t.id)):[];const X={};exps.forEach(e=>(X[e.task_id]=X[e.task_id]||[]).push(e));return{r,tasks,X}}
function aggregate(d,withCost){const {tasks,X}=d;const BT=new Map(),BU=new Map(),BS=new Map(),BE=new Map();let noRate=new Set();
  for(const t of tasks){const k=ticket(t.ticket_no);const h=durH(t);const ea=expTot(X[t.id],['Approved']),ep=expTot(X[t.id],['Submitted','Validated','Returned']);let l=0;if(withCost){const v=laborOf(t);if(v==null)noRate.add(t.staff_code);else l=v}
    let b=BT.get(t.ticket_no);if(!b){b={no:t.ticket_no,client:k?k.client:'(unknown)',unit:k?k.unit:'(unknown)',type:k?k.type:'?',hours:0,labor:0,ea:0,ep:0,staff:new Set(),n:0};BT.set(t.ticket_no,b)}b.hours+=h;b.labor+=l;b.ea+=ea;b.ep+=ep;b.staff.add(t.staff_code);b.n++;
    const ukey=b.unit;let u=BU.get(ukey);if(!u){u={unit:b.unit,type:b.type,tickets:new Set(),hours:0,labor:0,ea:0,ep:0};BU.set(ukey,u)}u.tickets.add(t.ticket_no);u.hours+=h;u.labor+=l;u.ea+=ea;u.ep+=ep;
    const m=ym(t.started_at),sk=t.staff_code+'|'+m;let s=BS.get(sk);if(!s){const p=person(t.staff_code);s={code:t.staff_code,name:pname(t.staff_code),team:p?p.team:'',month:m,client:0,internal:0};BS.set(sk,s)}if(b.type==='Profit')s.client+=h;else s.internal+=h;
    let e=BE.get(t.staff_code);if(!e){const p=person(t.staff_code);e={code:t.staff_code,name:pname(t.staff_code),team:p?p.team:'',hours:0,labor:0,ot:0};BE.set(t.staff_code,e)}e.hours+=h;e.labor+=l;if(t.work_type!=='regular')e.ot+=h}
  const byTicket=[...BT.values()].map(b=>{b.sn=b.staff.size;b.total=b.labor+b.ea;const rv=S.revenue[b.no];b.revenue=b.type==='Profit'&&rv?num(rv.revenue):null;b.margin=b.revenue==null?null:b.revenue-b.total;b.mpct=b.revenue?b.margin/b.revenue*100:null;return b}).sort((a,b)=>withCost?b.total-a.total:b.hours-a.hours);
  const byUnit=[...BU.values()].map(u=>{u.tn=u.tickets.size;u.total=u.labor+u.ea;const revs=byTicket.filter(b=>b.unit===u.unit&&b.revenue!=null);u.revenue=revs.length?revs.reduce((a,b)=>a+b.revenue,0):null;u.margin=u.revenue==null?null:u.revenue-revs.reduce((a,b)=>a+b.total,0);return u}).sort((a,b)=>(a.type+a.unit).localeCompare(b.type+b.unit));
  const util=[...BS.values()].map(s=>{s.total=s.client+s.internal;s.pct=s.total?s.client/s.total*100:0;return s}).sort((a,b)=>a.month<b.month?1:a.month>b.month?-1:a.name.localeCompare(b.name));
  const byEmp=[...BE.values()].sort((a,b)=>a.name.localeCompare(b.name));
  const T={hours:byTicket.reduce((a,b)=>a+b.hours,0),labor:byTicket.reduce((a,b)=>a+b.labor,0),ea:byTicket.reduce((a,b)=>a+b.ea,0),ep:byTicket.reduce((a,b)=>a+b.ep,0)};T.total=T.labor+T.ea;const pr=byTicket.filter(b=>b.revenue!=null);T.revenue=pr.reduce((a,b)=>a+b.revenue,0);T.margin=T.revenue-pr.reduce((a,b)=>a+b.total,0);
  return{byTicket,byUnit,util,byEmp,T,noRate:[...noRate]}}
const CSV={};
function table(id,cols,rows,T){CSV[id]={cols,rows};return `<div class="actions" style="margin:.2rem 0"><button class="btn sm ghost" data-act="csv" data-id="${id}">Download CSV</button></div><div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.html?c.html(r):esc(c.v(r))}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="muted">No data for this period.</td></tr>`}${T?`<tr class="tot">${cols.map((c,i)=>`<td class="${c.n?'n':''}">${i===0?'Total':(c.tot?c.tot(T):'')}</td>`).join('')}</tr>`:''}</tbody></table></div>`}
ACT.csv=d=>{const t=CSV[d.id];if(!t)return;const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const lines=[t.cols.map(c=>q(c.h)).join(',')].concat(t.rows.map(r=>t.cols.map(c=>q(c.raw?c.raw(r):c.v(r))).join(',')));download(`JTS_${d.id}_${today()}.csv`,'﻿'+lines.join('\r\n'),'text/csv')};
const pesoCol=(h,f,tot)=>({h,n:1,v:r=>f(r)==null?'':f(r).toFixed(2),html:r=>f(r)==null?'—':peso(f(r)),tot:tot});
const marginCol=(h,f,tot)=>({h,n:1,v:r=>f(r)==null?'':f(r).toFixed(2),html:r=>f(r)==null?'—':`<span class="${f(r)<0?'bad':'ok'}">${peso(f(r))}</span>`,tot:tot});
ACT.sub=d=>{UI.sub[UI.view]=d.v;render()};
function subTabs(list){const cur=UI.sub[UI.view]||list[0][0];return `<div class="tabs2">${list.map(([k,l])=>`<button data-act="sub" data-v="${k}" class="${cur===k?'on':''}">${l}</button>`).join('')}</div>`}

/* ====================== HOURS REPORTS (Operations / Finance / Management) ====================== */
V.hours=Object.assign(d=>{const A=aggregate(d,false);const T=A.T;const sub=UI.sub.hours||'ticket';let body='';
  if(sub==='ticket')body=table('hours-per-ticket',[{h:'Ticket',v:r=>r.no,html:r=>`<a href="#" data-act="drill" data-no="${esc(r.no)}">${esc(r.no)}</a>`},{h:'Client / subject',v:r=>r.client},{h:'Unit',v:r=>r.unit},{h:'Type',v:r=>r.type},{h:'Employees',n:1,v:r=>r.sn},{h:'Tasks',n:1,v:r=>r.n},{h:'Hours',n:1,v:r=>hrs(r.hours),tot:t=>hrs(t.hours)},pesoCol('Approved expenses',r=>r.ea,t=>peso(t.ea)),pesoCol('Expenses in review',r=>r.ep,t=>peso(t.ep))],A.byTicket,T);
  if(sub==='unit')body=table('hours-per-unit',[{h:'Unit',v:r=>r.unit},{h:'Type',v:r=>r.type==='Profit'?'Profit center':'Cost center'},{h:'Tickets',n:1,v:r=>r.tn},{h:'Hours',n:1,v:r=>hrs(r.hours),tot:t=>hrs(t.hours)},pesoCol('Approved expenses',r=>r.ea,t=>peso(t.ea)),pesoCol('Expenses in review',r=>r.ep,t=>peso(t.ep))],A.byUnit,T);
  if(sub==='util')body=`<p class="muted">Client-service hours = time on profit-center tickets. Internal hours = time on cost-center tickets.</p>`+table('utilization',[{h:'Month',v:r=>r.month},{h:'Employee',v:r=>r.name},{h:'Team',v:r=>r.team},{h:'Client-service hrs',n:1,v:r=>hrs(r.client)},{h:'Internal hrs',n:1,v:r=>hrs(r.internal)},{h:'Total hrs',n:1,v:r=>hrs(r.total)},{h:'Client-service %',n:1,v:r=>r.pct.toFixed(1),html:r=>r.pct.toFixed(1)+'%'}],A.util);
  return `<h2>Hours Reports</h2><p class="lead">Hours consumed per ticket, per service line and department, and per employee. No pay data is used here.</p><div class="filters">${rangeFilter('h')}</div><div class="kpis"><div class="kpi"><b>${hrs(T.hours)}</b><span>Hours logged (completed tasks)</span></div><div class="kpi"><b>${A.byTicket.length}</b><span>Tickets worked on</span></div><div class="kpi"><b>${new Set(d.tasks.map(t=>t.staff_code)).size}</b><span>Employees with hours</span></div><div class="kpi"><b>${peso(T.ea)}</b><span>Approved expenses</span></div></div>${subTabs([['ticket','Per ticket'],['unit','Per service line / department'],['util','Utilization']])}${body}`},{load:()=>reportData('h')});

/* ====================== COST REPORTS (Finance / Management) ====================== */
V.cost=Object.assign(d=>{const A=aggregate(d,true);const T=A.T;const sub=UI.sub.cost||'ticket';let body='';
  if(sub==='ticket')body=`<p class="muted">Cost = labor (hours × loaded hourly rate × work-type multiplier) + Approved expenses. Revenue is what Finance encoded on the ticket; for multi-month projects, pick a period that covers the whole project. Revenue and margin totals count profit-center tickets with revenue only.</p>`+table('cost-per-ticket',[{h:'Ticket',v:r=>r.no,html:r=>`<a href="#" data-act="drill" data-no="${esc(r.no)}">${esc(r.no)}</a>`},{h:'Client / subject',v:r=>r.client},{h:'Unit',v:r=>r.unit},{h:'Hours',n:1,v:r=>hrs(r.hours),tot:t=>hrs(t.hours)},pesoCol('Labor',r=>r.labor,t=>peso(t.labor)),pesoCol('Approved expenses',r=>r.ea,t=>peso(t.ea)),pesoCol('Total cost',r=>r.total,t=>peso(t.total)),pesoCol('Revenue',r=>r.revenue,t=>peso(t.revenue)),marginCol('Margin',r=>r.margin,t=>peso(t.margin)),{h:'Margin %',n:1,v:r=>r.mpct==null?'':r.mpct.toFixed(1),html:r=>r.mpct==null?'—':r.mpct.toFixed(1)+'%'}],A.byTicket,T);
  if(sub==='unit')body=`<p class="muted">Profit-center rows give the direct cost per service line. Cost-center rows give the cost per department.</p>`+table('cost-per-unit',[{h:'Unit',v:r=>r.unit},{h:'Type',v:r=>r.type==='Profit'?'Profit center':'Cost center'},{h:'Tickets',n:1,v:r=>r.tn},{h:'Hours',n:1,v:r=>hrs(r.hours),tot:t=>hrs(t.hours)},pesoCol('Labor',r=>r.labor,t=>peso(t.labor)),pesoCol('Approved expenses',r=>r.ea,t=>peso(t.ea)),pesoCol('Total cost',r=>r.total,t=>peso(t.total)),pesoCol('Revenue',r=>r.revenue),marginCol('Margin',r=>r.margin)],A.byUnit,T);
  if(sub==='emp')body=table('labor-per-employee',[{h:'Employee',v:r=>r.name},{h:'Team',v:r=>r.team},{h:'Hours',n:1,v:r=>hrs(r.hours),tot:t=>hrs(t.hours)},{h:'OT / premium hrs',n:1,v:r=>hrs(r.ot)},pesoCol('Labor cost',r=>r.labor,t=>peso(t.labor)),{h:'Current loaded rate',n:1,v:r=>{const x=rateFor(r.code,today());return x==null?'':x.toFixed(2)},html:r=>{const x=rateFor(r.code,today());return x==null?'<span class="bad">no pay</span>':peso(x)}}],A.byEmp,T);
  return `<h2>Cost Reports</h2><p class="lead">Labor and expense cost per ticket, per service line and department, and per employee. Finance and Management only.</p><div class="filters">${rangeFilter('c')}</div>${A.noRate.length?`<div class="banner err"><b>No pay record for:</b> ${A.noRate.map(c=>esc(pname(c))).join(', ')}. Their labor is counted as ₱0 until Finance adds pay in Pay &amp; Benefits.</div>`:''}${!S.settings?'<div class="banner err">Costing settings are missing.</div>':''}<div class="kpis"><div class="kpi"><b>${hrs(T.hours)}</b><span>Hours</span></div><div class="kpi"><b>${peso(T.labor)}</b><span>Labor cost</span></div><div class="kpi"><b>${peso(T.ea)}</b><span>Approved expenses</span></div><div class="kpi"><b>${peso(T.total)}</b><span>Total cost</span></div><div class="kpi"><b>${peso(T.revenue)}</b><span>Revenue (profit tickets)</span></div><div class="kpi"><b class="${T.margin<0?'bad':''}">${peso(T.margin)}</b><span>Margin (profit tickets)</span></div></div>${subTabs([['ticket','Cost per ticket'],['unit','Per service line / department'],['emp','Labor per employee']])}${body}`},{load:async()=>{await refreshTickets();S.pay=await sel('pay',q=>q.order('effective_date',{ascending:false}));S.settings=(await sel('settings'))[0]||null;return reportData('c')}});

/* ====================== EXCEPTIONS ====================== */
V.exc=Object.assign(d=>{const {list}=d;const sev={High:0,Medium:1,Low:2};list.sort((a,b)=>sev[a.sev]-sev[b.sev]||a.type.localeCompare(b.type));
  return `<h2>Exceptions</h2><p class="lead">Data-quality and follow-up items for the period. Clear the High items first.</p><div class="filters">${rangeFilter('x')}</div>`+table('exceptions',[{h:'Severity',v:e=>e.sev,html:e=>`<span class="chip ${e.sev==='High'?'red':e.sev==='Medium'?'':'grey'}">${e.sev}</span>`},{h:'Exception',v:e=>e.type},{h:'Reference',v:e=>e.ref},{h:'Employee',v:e=>e.who?pname(e.who):''},{h:'Detail',v:e=>e.detail},{h:'Owner',v:e=>e.owner}],list)},
  {load:async()=>{const r=range('x');const [tasks,running,open]=await Promise.all([sel('tasks',q=>q.gte('started_at',r.fromISO).lt('started_at',r.toISO).eq('voided',false)),sel('tasks',q=>q.is('ended_at',null).eq('voided',false)),sel('expenses',q=>q.in('status',['Submitted','Validated','Returned']))]);
    const ids=tasks.map(t=>t.id);const edits=ids.length?await selIn('task_edits','task_id',ids):[];const L=[];const now=nowMs();const bd=iso=>(now-new Date(iso))/864e5;
    running.forEach(t=>{const h=(now-new Date(t.started_at))/36e5;if(h>10)L.push({sev:'High',type:'Timer running more than 10 hours',ref:t.id,who:t.staff_code,detail:'Started '+fmtDT(t.started_at),owner:'Employee / Operations'})});
    tasks.filter(t=>t.ended_at&&durH(t)>12).forEach(t=>L.push({sev:'Medium',type:'Task longer than 12 hours',ref:t.id,who:t.staff_code,detail:hrs(durH(t))+' h',owner:'Operations'}));
    const ec={};edits.forEach(e=>ec[e.task_id]=(ec[e.task_id]||0)+1);tasks.filter(t=>ec[t.id]).forEach(t=>L.push({sev:'Low',type:'Times or ticket corrected after logging',ref:t.id,who:t.staff_code,detail:ec[t.id]+' correction(s)',owner:'Operations'}));
    tasks.forEach(t=>{const k=ticket(t.ticket_no);if(k&&k.status==='Closed'&&new Date(t.started_at)>new Date(k.updated_at))L.push({sev:'Medium',type:'Task dated after ticket was closed',ref:t.id,who:t.staff_code,detail:t.ticket_no,owner:'Operations'})});
    open.forEach(e=>{const age=bd(e.updated_at);if(e.status==='Submitted'&&age>2)L.push({sev:'Medium',type:'Expense awaiting Operations > 2 days',ref:e.id,who:e.staff_code,detail:peso(e.amount)+' · '+age.toFixed(1)+' days',owner:'Operations'});if(e.status==='Validated'&&age>2)L.push({sev:'Medium',type:'Expense awaiting Finance > 2 days',ref:e.id,who:e.staff_code,detail:peso(e.amount)+' · '+age.toFixed(1)+' days',owner:'Finance'});if(e.status==='Returned'&&age>3)L.push({sev:'Low',type:'Returned expense not resubmitted > 3 days',ref:e.id,who:e.staff_code,detail:e.ops_note||e.fin_note,owner:'Employee'})});
    const withHours=new Set(tasks.map(t=>t.staff_code));S.roster.filter(p=>p.active&&p.user_id&&!withHours.has(p.code)).forEach(p=>L.push({sev:'Low',type:'No hours logged in period',ref:p.code,who:p.code,detail:p.team,owner:'Team Lead'}));
    if(canAdmin())S.roster.filter(p=>p.active&&!p.user_id).forEach(p=>L.push({sev:'Low',type:p.email?'Not yet registered':'No company email on roster',ref:p.code,who:p.code,detail:p.email||'Add email, then issue a sign-up code',owner:'Operations'}));
    if(canCost()){withHours.forEach(c=>{if(!payFor(c,today()))L.push({sev:'High',type:'Hours logged but no pay record',ref:c,who:c,detail:'Labor counted as ₱0',owner:'Finance'})});
      S.tickets.filter(t=>t.type==='Profit'&&['Reviewed','Closed'].includes(t.status)&&!S.revenue[t.no]).forEach(t=>L.push({sev:'Medium',type:'Reviewed/closed profit ticket without revenue',ref:t.no,who:'',detail:t.client,owner:'Finance'}))}
    return{list:L}}});

V.roster=Object.assign(()=>{const mg=isMgmt();const editable=p=>mg||['staff','operations'].includes(p.role);
  return `<h2>Roster &amp; Access</h2><p class="lead">Who can sign in and what they can see. Only employees on this roster can register.</p><div class="banner info"><b>Onboarding:</b> add the employee with their company email → click <b>Sign-up code</b> → send the code privately (Google Chat). They open the app, choose <i>First-time registration</i>, and set their own password. ${mg?'':'Finance and Management accounts are managed by Management.'}</div><div class="actions" style="margin-bottom:.8rem"><button class="btn" data-act="newStaff">+ Add employee</button></div><div class="tw"><table><thead><tr><th>Code</th><th>Name</th><th>Team</th><th>Position</th><th>Role</th><th>Company email</th><th>Sign-in</th><th></th></tr></thead><tbody>${S.roster.slice().sort((a,b)=>(a.active===b.active?0:a.active?-1:1)||(a.team+a.name).localeCompare(b.team+b.name)).map(p=>`<tr${p.active?'':' style="opacity:.5"'}><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.team)}</td><td>${esc(p.position)}</td><td><span class="chip ${p.role==='staff'?'out':'navy'}">${esc(ROLES[p.role])}</span></td><td>${p.email?esc(p.email):'<span class="bad">not set</span>'}</td><td>${!p.active?'<span class="chip grey">inactive</span>':p.user_id?'<span class="chip green">registered</span>':'<span class="chip grey">not registered</span>'}</td><td class="nw">${editable(p)?`<button class="btn sm ghost" data-act="editStaff" data-code="${esc(p.code)}">Edit</button>${p.active&&!p.user_id&&p.email?` <button class="btn sm" data-act="issueCode" data-code="${esc(p.code)}">Sign-up code</button>`:''}${p.active&&p.user_id&&p.code!==S.me.code?` <button class="btn sm ghost" data-act="resetPw" data-code="${esc(p.code)}">Reset password</button>`:''}`:'<span class="muted">Management only</span>'}</td></tr>`).join('')}</tbody></table></div>`},{load:async()=>{S.roster=await sel('roster',q=>q.order('name'));return{}}});
function staffForm(p){p=p||{};const mg=isMgmt();const roles=mg?Object.keys(ROLES):['staff','operations'];const reg=!!p.user_id;return `<div class="row"><div><label>Staff code (2–5 letters)<input name="code" value="${esc(p.code||'')}" maxlength="5" style="text-transform:uppercase" ${p.code?'readonly':''} required></label></div><div><label>Name<input name="name" value="${esc(p.name||'')}" required></label></div></div><label>Company email${reg?' (locked after registration)':''}<input name="email" type="email" value="${esc(p.email||'')}" ${reg?'readonly':''}></label><div class="row"><div><label>Team / department<select name="team">${UNITS.map(u=>`<option${p.team===u?' selected':''}>${esc(u)}</option>`).join('')}</select></label></div><div><label>Position / level<input name="position" value="${esc(p.position||'')}"></label></div></div><div class="row"><div><label>Access role<select name="role">${roles.map(r=>`<option value="${r}"${(p.role||'staff')===r?' selected':''}>${ROLES[r]}</option>`).join('')}</select></label></div><div><label>Status<select name="active"><option value="true"${p.active!==false?' selected':''}>Active</option><option value="false"${p.active===false?' selected':''}>Inactive (blocks sign-in immediately)</option></select></label></div></div><p class="muted"><b>Staff</b>: own tasks only. <b>Operations</b>: all tasks and hours, tickets, roster, expense validation. <b>Finance</b>: pay, revenue, costing and expense final check. <b>Management</b>: everything (pay read-only).</p>`}

/* ====================== PAY & BENEFITS (Finance edit, Management read) ====================== */
V.pay=Object.assign(()=>{const fin=isFin();const show=UI.showPay;const t=today();const mask=v=>show?peso(v):'••••••';
  const rows=S.roster.filter(p=>p.active).sort((a,b)=>(a.team+a.name).localeCompare(b.team+b.name));
  return `<h2>Pay &amp; Benefits</h2><p class="lead">Monthly basic salary and employer-paid benefits per employee, with effective dates. ${fin?'Only Finance can change these.':'Read-only for Management.'}</p><div class="banner info">Loaded hourly rate = (monthly basic salary + monthly employer-paid benefits) × 12 ÷ ${S.settings?esc(S.settings.work_days):'261'} days ÷ ${S.settings?esc(S.settings.hours_per_day):'8'} hours. Each task uses the pay record effective on the task date. Benefits = employer share of SSS, PhilHealth, Pag-IBIG, 13th-month accrual and other regular benefits, as computed by Finance.</div><div class="actions" style="margin-bottom:.8rem">${fin?'<button class="btn" data-act="newPay">+ Add pay record</button>':''}<button class="btn ghost" data-act="togglePay">${show?'Hide':'Show'} amounts</button></div><div class="tw"><table><thead><tr><th>Employee</th><th>Team</th><th>Effective</th><th class="n">Basic salary / mo</th><th class="n">Benefits / mo</th><th class="n">Loaded rate / hr</th><th></th></tr></thead><tbody>${rows.map(p=>{const c=payFor(p.code,t);const r=rateFor(p.code,t);const n=S.pay.filter(x=>x.code===p.code).length;return `<tr><td>${esc(p.name)} <span class="muted">(${esc(p.code)})</span></td><td>${esc(p.team)}</td><td class="nw">${c?esc(c.effective_date):'<span class="bad">no pay record</span>'}</td><td class="n">${c?mask(c.monthly_salary):'—'}</td><td class="n">${c?mask(c.monthly_benefits):'—'}</td><td class="n">${r==null?'—':(show?peso(r):'••••')}</td><td class="nw">${n?`<button class="btn sm ghost" data-act="payHistory" data-code="${esc(p.code)}">History (${n})</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`},{load:async()=>{S.pay=await sel('pay',q=>q.order('effective_date',{ascending:false}));S.settings=(await sel('settings'))[0]||null;return{}}});
ACT.togglePay=()=>{UI.showPay=!UI.showPay;render()};
ACT.newPay=d=>openModal({title:'Add pay record',form:'pay',ok:'Save pay record',html:`<label>Employee<select name="code" required>${S.roster.filter(p=>p.active).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.code)}"${d&&d.code===p.code?' selected':''}>${esc(p.name)} (${esc(p.code)}) · ${esc(p.team)}</option>`).join('')}</select></label><label>Effective date<input type="date" name="eff" value="${today().slice(0,7)}-01" required></label><div class="row"><div><label>Monthly basic salary (₱)<input name="sal" type="number" step="0.01" min="0" required></label></div><div><label>Monthly employer-paid benefits (₱)<input name="ben" type="number" step="0.01" min="0" value="0" required></label></div></div><label>Note (e.g. salary increase, regularization)<input name="note" maxlength="200"></label><p class="muted">A new record does not change costs of tasks dated before its effective date.</p>`});
FORMS.pay=async fd=>{await write(db.from('pay').insert({code:fd.code,effective_date:fd.eff,monthly_salary:Number(fd.sal),monthly_benefits:Number(fd.ben||0),note:fd.note||''}));closeModal();toast('Pay record saved.');await show()};
ACT.payHistory=d=>{const p=person(d.code);const list=S.pay.filter(x=>x.code===d.code).sort((a,b)=>a.effective_date<b.effective_date?1:-1);const fin=isFin();
  openModal({title:'Pay history · '+p.name,wide:true,html:`<div class="tw"><table><thead><tr><th>Effective</th><th class="n">Basic salary</th><th class="n">Benefits</th><th>Note</th><th>Entered</th>${fin?'<th></th>':''}</tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.effective_date)}</td><td class="n">${peso(x.monthly_salary)}</td><td class="n">${peso(x.monthly_benefits)}</td><td>${esc(x.note)}</td><td class="muted">${esc(pname(x.created_by))} ${fmtDT(x.created_at)}</td>${fin?`<td><button class="btn sm danger" data-act="delPay" data-id="${x.id}">Delete</button></td>`:''}</tr>`).join('')}</tbody></table></div>${fin?`<div class="actions"><button class="btn" data-act="newPay" data-code="${esc(p.code)}">+ Add record</button></div>`:''}`})};
ACT.delPay=async d=>{if(!confirm('Delete this pay record? Costs of tasks that used it will change.'))return;try{await write(db.from('pay').delete().eq('id',Number(d.id)));closeModal();toast('Deleted.');await show()}catch(e){toast(e.message,'err')}};

/* ====================== REVENUE (Finance edit, Management read) ====================== */
V.revenue=Object.assign(()=>{const fin=isFin();const pe=UI.f.rvp||'';const st=UI.f.rvs||'';const rows=S.tickets.filter(t=>t.type==='Profit'&&(!pe||t.period===pe)&&(!st||(st==='missing'?!S.revenue[t.no]:!!S.revenue[t.no])));
  return `<h2>Revenue</h2><p class="lead">Revenue per profit-center ticket, encoded from the actual sales invoice. ${fin?'Only Finance can change these.':'Read-only for Management.'}</p><div class="filters"><div><label>Period<input type="month" data-f="rvp" value="${esc(pe)}"></label></div><div><label>Show<select data-f="rvs"><option value="">All</option><option value="missing"${st==='missing'?' selected':''}>Without revenue</option><option value="has"${st==='has'?' selected':''}>With revenue</option></select></label></div></div>`+table('revenue',[{h:'Ticket',v:t=>t.no},{h:'Client',v:t=>t.client},{h:'Unit',v:t=>t.unit},{h:'Period',v:t=>t.period},{h:'Status',v:t=>t.status},{h:'Invoice no.',v:t=>S.revenue[t.no]?S.revenue[t.no].invoice_no:''},pesoCol('Revenue',t=>S.revenue[t.no]?num(S.revenue[t.no].revenue):null),{h:'',v:()=>'',html:t=>fin?`<button class="btn sm ghost" data-act="editRev" data-no="${esc(t.no)}">${S.revenue[t.no]?'Edit':'Encode'}</button>`:''}],rows.slice(0,500))},{load:async()=>{await refreshTickets();return{}}});
ACT.editRev=d=>{const t=ticket(d.no);const r=S.revenue[d.no]||{};openModal({title:'Revenue · '+t.no,form:'rev',data:{no:t.no},html:`<p class="muted">${esc(t.client)} · ${esc(t.unit)} · ${esc(t.period)}</p><div class="row"><div><label>Revenue billed (₱, net of VAT)<input name="rev" type="number" step="0.01" min="0" value="${r.revenue!=null?esc(r.revenue):''}" required></label></div><div><label>Sales invoice no.<input name="inv" value="${esc(r.invoice_no||'')}" maxlength="40"></label></div></div>${r.revenue!=null?'<label><input type="checkbox" name="clear"> Remove the revenue for this ticket</label>':''}`})};
FORMS.rev=async(fd,ds)=>{if(fd.clear==='on')await write(db.from('ticket_revenue').delete().eq('ticket_no',ds.no));else await write(db.from('ticket_revenue').upsert({ticket_no:ds.no,revenue:Number(fd.rev),invoice_no:fd.inv||'',updated_at:new Date().toISOString(),updated_by:S.me.code},{onConflict:'ticket_no'}));closeModal();toast('Revenue saved.');await show()};

/* ====================== COSTING SETTINGS ====================== */
V.settings=Object.assign(()=>{const s=S.settings||{};const fin=isFin();const dis=fin?'':' disabled';
  return `<h2>Costing Settings</h2><p class="lead">Basis for the hourly rate and the pay multipliers by work type. ${fin?'Finance maintains these.':'Read-only for Management.'}</p><div class="card"><form data-form="settings"><h3 style="margin-top:0">Hourly rate basis</h3><div class="row"><div><label>Working days per year<input name="work_days" type="number" min="200" max="366" step="1" value="${esc(s.work_days)}"${dis}></label></div><div><label>Hours per day<input name="hours_per_day" type="number" min="1" max="12" step="0.5" value="${esc(s.hours_per_day)}"${dis}></label></div></div><h3>Multipliers by work type</h3><div class="banner warn">Defaults are placeholders. <b>Confirm with HR/Finance against current DOLE rules</b> (Labor Code premium and overtime provisions and the year's holiday proclamations) before relying on cost reports. Combined cases (e.g. overtime on a regular holiday) need a separate rule; log them under the closest type and note it on the task.</div><div class="row">${Object.entries(WT).map(([k,v])=>`<div><label>${v}<input name="m_${k}" type="number" step="0.01" min="0" value="${esc(s['m_'+k])}"${dis}></label></div>`).join('')}</div>${s.updated_by?`<p class="muted">Last changed by ${esc(pname(s.updated_by))} ${fmtDT(s.updated_at)}</p>`:''}${fin?'<div class="actions"><button class="btn">Save settings</button></div>':''}</form></div>`},{load:async()=>{S.settings=(await sel('settings'))[0]||null;return{}}});
FORMS.settings=async fd=>{const v={};for(const k of ['work_days','hours_per_day','m_regular','m_overtime','m_restday','m_special','m_holiday']){const x=Number(fd[k]);if(!(x>=0))throw new Error('Check '+k.replace('_',' '));v[k]=x}v.updated_by=S.me.code;v.updated_at=new Date().toISOString();await write(db.from('settings').update(v).eq('id',1));toast('Settings saved.');await show()};

/* ====================== ACCOUNT ====================== */
V.account=()=>`<h2>My Account</h2><p class="lead">${esc(S.me.name)} · ${esc(S.me.team)} · ${esc(ROLES[role()])} access</p><div class="grid2"><div class="card"><h3 style="margin-top:0">Change my password</h3><form data-form="changePw"><label>New password (at least 8 characters)<input name="pw" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm<input name="pw2" type="password" autocomplete="new-password" required></label><div class="actions"><button class="btn">Change password</button></div></form></div><div class="card"><h3 style="margin-top:0">Signed in as</h3><p>${esc(S.session.user.email)}</p><p class="muted">Sign out when using a shared computer.</p><button class="btn ghost" data-act="signOut">Sign out</button></div></div>`;
FORMS.changePw=async fd=>{if(fd.pw!==fd.pw2)throw new Error('Passwords do not match.');if(fd.pw.length<8)throw new Error('At least 8 characters.');const {error}=await db.auth.updateUser({password:fd.pw});if(error)throw new Error(cleanErr(error));toast('Password changed.');$('form[data-form=changePw]').reset()};

/* ====================== HELP ====================== */
const HELP={
staff:`<h3>For every employee (Staff)</h3>
<div class="card"><h4>First sign-in</h4><ol><li>Operations sends you an 8-character <b>sign-up code</b> by Google Chat.</li><li>Open the Job Ticket System file (shared Google Drive folder → download, then open in Chrome).</li><li>Click <b>First-time registration</b>. Enter your company email, the code, and a password of at least 8 characters.</li><li>Next time, just <b>Sign in</b> with your email and password. Forgot it? Ask Operations to reset it.</li></ol></div>
<div class="card"><h4>Every task, every day</h4><ol><li>Open <b>Timer</b>. Choose the <b>job ticket</b>: the client engagement you are working on, or your department's internal ticket for admin work.</li><li>Type what you are doing (e.g. “Reconcile October bank statement”) and the work type (regular, overtime, rest day, holiday).</li><li>Click <b>▶ Start timer</b>. A Task ID is created (e.g. TSK-2611-BHE-004).</li><li>When you finish or switch work, click <b>■ Stop</b>. Then start the next task. Only one timer runs at a time.</li><li>Lunch and breaks: stop the timer, start again after.</li></ol></div>
<div class="card"><h4>Forgot to start or stop?</h4><ol><li>Open <b>My Log</b>, click <b>Edit</b> on the task, correct the start/finish time and enter the <b>reason</b>.</li><li>Missed a whole task? Start and stop it, then edit its times to the actual ones with a reason.</li><li>Logged on the wrong ticket? Edit and choose the right ticket (reason required).</li><li>Logged by mistake? <b>Void</b> it with a reason. Voided tasks stay on record but count zero hours.</li><li>Once Operations marks a ticket <b>Reviewed</b>, only Operations can correct its tasks.</li></ol></div>
<div class="card"><h4>Expenses you paid for a task</h4><ol><li>On the task (Timer or My Log), click <b>+ Expense</b>.</li><li>Choose the type, enter the <b>actual amount</b> on the receipt, the date and a short description (required for “Others”).</li><li>Attach a clear <b>photo or PDF of the receipt</b> (required, max 10 MB).</li><li>Track it in <b>My Expenses</b>: Submitted → <b>Validated</b> by Operations → <b>Approved</b> by Finance.</li><li>If it is <b>Returned</b>, read the note, click <b>Fix &amp; resubmit</b>, correct it and resubmit.</li><li>Overtime and holiday pay are not expenses: they are computed from your hours and work type.</li></ol></div>
<div class="card"><h4>What you can see</h4><ul><li>Only your own tasks, expenses and receipts. Nobody else's.</li><li>No salary or rate information is ever shown to Staff.</li></ul></div>`,
ops:`<h3>For Operations</h3>
<div class="card"><h4>Set up and onboard (Roster &amp; Access)</h4><ol><li>Add each employee with a 2–5 letter code, team, position, <b>company email</b> and role (Staff or Operations).</li><li>Click <b>Sign-up code</b> and send the code privately. It works once; issuing a new code cancels the old one.</li><li>Forgotten password: <b>Reset password</b>, give the temporary password privately, ask them to change it in My Account.</li><li>Resigned or on leave without access: set <b>Inactive</b>. Sign-in is blocked immediately; their history stays.</li><li>Finance and Management accounts are added and reset by Management only.</li></ol></div>
<div class="card"><h4>Tickets</h4><ol><li>On a signed engagement / service agreement, create a ticket: Engagement ID, client, unit, kind, period.</li><li>At the start of every month, click <b>Generate monthly tickets</b>: it creates the internal cost-center tickets and copies active retainers and recurring compliance tickets.</li><li>Tick <b>Engagement ended</b> on the last ticket of a terminated retainer.</li><li>Move tickets through <b>Open → Submitted → Reviewed → Closed</b>. Staff can only log to Open tickets and cannot edit tasks on Reviewed tickets. Closing needs the Management approver's name; only Management can reopen a Closed ticket.</li><li>Click <b>Detail</b> to see every task, who executed it, start and finish times and hours.</li></ol></div>
<div class="card"><h4>Daily (before end of day)</h4><ol><li><b>Expense Review</b> → “Needs my action”: open the receipt, check amount, date, task and ticket. <b>Validate</b>, or <b>Return</b> with a clear note.</li><li><b>Exceptions</b>: clear High items (timers running too long, missing data).</li><li><b>Task Review</b>: correct obvious errors (with reason) and void duplicates.</li></ol></div>
<div class="card"><h4>Weekly (Friday)</h4><ol><li><b>Hours Reports</b> → per ticket, per service line and utilization. Download CSV for the weekly COO report.</li><li>Follow up employees with no hours logged and unregistered employees.</li><li>Mark completed tickets <b>Reviewed</b> after checking their tasks.</li></ol></div>
<div class="card"><h4>Limits of the Operations role</h4><ul><li>You see all hours, tasks, expenses and receipts, but <b>no salaries, rates, labor cost or revenue</b>.</li><li>You cannot validate your own expenses (Management does).</li></ul></div>`,
fin:`<h3>For Finance</h3>
<div class="card"><h4>Pay &amp; Benefits (Finance only)</h4><ol><li>For each employee, <b>+ Add pay record</b>: effective date, monthly basic salary and monthly employer-paid benefits (employer SSS, PhilHealth, Pag-IBIG, 13th-month accrual, other regular benefits).</li><li>On a salary change, add a new record with the new effective date. Do not overwrite the old one: older tasks keep their old rate.</li><li>Amounts are hidden by default; click <b>Show amounts</b> when no one is looking over your shoulder.</li></ol></div>
<div class="card"><h4>Costing Settings</h4><ol><li>Confirm working days per year (default 261) and hours per day (default 8).</li><li>Confirm the multipliers for overtime, rest day, special day and regular holiday with HR against current DOLE rules before relying on the reports.</li></ol></div>
<div class="card"><h4>Expense final check (daily)</h4><ol><li><b>Expense Review</b> → “Needs my action” shows expenses Operations has validated.</li><li>Check the receipt and policy, then <b>Approve</b>, <b>Return</b> to the employee, or <b>Reject</b> (note required). Only Approved expenses count in ticket cost.</li><li>You cannot approve your own expenses: Management does.</li></ol></div>
<div class="card"><h4>Revenue</h4><ol><li>When a sales invoice is issued, open <b>Revenue</b>, find the ticket and <b>Encode</b> the amount (net of VAT) and invoice number.</li><li>Use “Without revenue” to find tickets still missing an invoice.</li></ol></div>
<div class="card"><h4>Monthly cost close</h4><ol><li>Check <b>Exceptions</b> for “Hours logged but no pay record” and fix them first.</li><li><b>Cost Reports</b> → Last month: cost per ticket (labor + approved expenses vs revenue), per service line (profit centers) and per department (cost centers), labor per employee.</li><li>Download the CSVs for the management report and the books.</li></ol></div>`,
mgmt:`<h3>For Management (CEO / CFO)</h3>
<div class="card"><ul><li>You see everything: all tasks and hours, expenses and receipts, pay and benefits (read-only), revenue (read-only), cost and margin reports.</li><li>You add and reset <b>Finance and Management</b> accounts and assign those roles (Roster &amp; Access).</li><li>You validate expenses of <b>Operations</b> staff and give the final check on expenses of <b>Finance</b> staff (no one reviews their own).</li><li>You can close tickets (your name is recorded as approver) and reopen Closed tickets.</li><li>Monthly: Cost Reports → margin per ticket and per service line; Hours Reports → utilization; Exceptions → data quality.</li></ul></div>`,
faq:`<h3>Questions</h3>
<div class="card"><h4>Do I need internet?</h4><p>Yes. Data is saved directly to TRANGIA's database. If the connection drops while a timer runs, the timer keeps its server start time; click Stop when you are back online.</p>
<h4>Can I use it on my phone?</h4><p>Yes, open the same file in your phone's browser and sign in. Receipt photos can be taken with the phone camera.</p>
<h4>Who sees my data?</h4><p>Your tasks and expenses: you, Operations, Finance and Management. Salaries: Finance and Management only. Access is enforced by the database itself, not just the screen.</p>
<h4>Why can't I pick a ticket?</h4><p>Only Open tickets can receive new time. Ask Operations to open the ticket or create the month's tickets.</p>
<h4>The app says my account is not active.</h4><p>You are inactive on the roster. Contact Operations.</p></div>`};
V.help=()=>{const t=UI.sub.help||(isFin()?'fin':isOps()?'ops':isMgmt()?'mgmt':'staff');return `<h2>Help — How to use the Job Ticket System</h2><p class="lead">Step-by-step guides for each role. Everyone also follows the Staff guide for their own time.</p>${subTabs([['staff','Staff (everyone)'],['ops','Operations'],['fin','Finance'],['mgmt','Management'],['faq','FAQ']])}<div class="help">${HELP[t]}</div>`};

/* ====================== EVENTS ====================== */
document.addEventListener('click',async e=>{const dec=e.target.closest('button[data-decision]');if(dec){const f=dec.closest('form');f.querySelector('input[name=decision]').value=dec.dataset.decision;return}
  const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();const f=ACT[b.dataset.act];if(!f)return;try{await f(b.dataset,e)}catch(err){toast(err.message||String(err),'err')}});
ACT.nav=d=>{UI.data=undefined;show(d.v)};
ACT.closeModal=()=>closeModal();
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(!fn)return;
  const fd=Object.fromEntries([...new FormData(f).entries()].filter(([k,v])=>typeof v==='string'));const btns=[...f.querySelectorAll('button')];btns.forEach(x=>x.disabled=true);
  try{await fn(fd,Object.assign({},f.dataset),f)}catch(err){toast(err.message||String(err),'err')}finally{btns.forEach(x=>x.disabled=false)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.f){UI.f[el.dataset.f]=el.value;if(V[UI.view]&&V[UI.view].load)show();else render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal)closeModal()});
setInterval(()=>{document.querySelectorAll('[data-elapsed]').forEach(el=>{el.textContent=fmtClock(nowMs()-new Date(el.dataset.elapsed))})},1000);
db.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&S.session){S.session=null;S.me=null;UI.data=undefined;render()}});

/* ---- update check: when a new version is published, ask open sessions to refresh ---- */
async function checkUpdate(){if(location.protocol==='file:'||$('#updbar'))return;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();if(v.build&&v.build!==BUILD){const d=document.createElement('div');d.id='updbar';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:98;background:#C9A84C;color:#1A1A1A;padding:.5rem 1rem;text-align:center;font-weight:bold';d.innerHTML='A new version of the Job Ticket System is available. Save any open form, then <button class="btn sm dark" onclick="location.reload()">Refresh now</button>';document.body.appendChild(d)}}catch(e){}}
setInterval(checkUpdate,5*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
window.__JTS={S,UI,V,ACT,FORMS,show,render,aggregate,rateFor,laborOf,range};
(async()=>{try{await loadBase()}catch(e){toast(e.message,'err')}if(S.session&&S.me)await show('timer');else render()})();
})();
</script>
